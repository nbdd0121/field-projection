[package]
name = "field-projection-internal"
version = "0.3.0"
authors = ["Gary Guo <gary@garyguo.net>", "Benno Lossin <lossin@kernel.org>"]
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/nbdd0121/field-projection"
description = """
Internal implementation details of crate `field-projection`.
"""

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["derive", "full", "visit", "visit-mut", "extra-traits"] }
